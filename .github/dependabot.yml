version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    # CI builds with --locked, so a Dependabot lockfile bump goes through the
    # same fmt / clippy / test / wasm-build jobs as any other PR.
    groups:
      cargo:
        patterns:
          - "*"
        # soroban-sdk carries protocol compatibility changes and the contract
        # cannot be upgraded once deployed, so its updates (majors included)
        # arrive as their own PR for individual review.
        exclude-patterns:
          - "soroban-sdk"
    ignore:
      # Cargo.lock deliberately pins ed25519-dalek to 2.2.0; a newer release
      # breaks the soroban-env-host test build (see README, "Known limitations").
      - dependency-name: "ed25519-dalek"
